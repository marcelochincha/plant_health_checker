apiVersion: apps/v1
kind: Deployment
metadata:
  name: classifier
  namespace: leaf-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: classifier
  template:
    metadata:
      labels:
        app: classifier
    spec:
      containers:
        - name: classifier
          image: leaf-classifier:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: leaf-env
          env:
            - name: ARTIFACTS_DIR
              value: /app/artifacts
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: classifier
  namespace: leaf-app
spec:
  selector:
    app: classifier
  ports:
    - port: 8000
      targetPort: 8000
