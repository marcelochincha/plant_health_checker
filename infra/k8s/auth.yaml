apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: leaf-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        - name: auth
          image: leaf-auth:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: leaf-env
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: auth
  namespace: leaf-app
spec:
  selector:
    app: auth
  ports:
    - port: 8000
      targetPort: 8000
