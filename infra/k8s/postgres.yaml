apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: leaf-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          envFrom:
            - secretRef:
                name: leaf-env
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "leaf_app"]
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: leaf-app
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
