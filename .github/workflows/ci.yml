name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: leaf_app
          POSTGRES_PASSWORD: leaf_app
          POSTGRES_DB: leaf_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U leaf_app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg2://leaf_app:leaf_app@localhost:5432/leaf_app
      DATABASE_URL_TEST: postgresql+psycopg2://leaf_app:leaf_app@localhost:5432/leaf_app
      JWT_SECRET: ci-secret
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: "60"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install root deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Install service deps
        run: |
          for svc in services/auth services/classifier services/training; do
            if [ -f "$svc/requirements.txt" ]; then
              pip install -r "$svc/requirements.txt"
            fi
          done

      - name: Run pytest
        run: pytest -v

  docker-build:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Build all images
        run: |
          docker build -t leaf-auth:ci -f services/auth/Dockerfile .
          docker build -t leaf-classifier:ci -f services/classifier/Dockerfile .
          docker build -t leaf-training:ci -f services/training/Dockerfile .
