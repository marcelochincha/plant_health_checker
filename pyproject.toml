[project]
name = "plant-health-checker"
version = "0.1.0"
description = "Leaf health classifier — backend that classifies leaf images as healthy or unhealthy."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.23",
    "opencv-python>=4.8",
    "scikit-image>=0.21",
    "scikit-learn>=1.3",
    "joblib>=1.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests", "services"]
pythonpath = ["."]

[tool.setuptools]
py-modules = ["pipeline", "features", "processing", "dataset", "classifiers"]
